[Proxy Group]
PROXY-US = url-test,interval=600,tolerance=100,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=(?i)(United\s*States)
PROXY-HK = url-test,interval=600,tolerance=100,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=(?=.*(Hong))^(?=.*(Kong))^.*$

[Rule]
DOMAIN-KEYWORD,youtube,PROXY-US
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,PROXY-US
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,PROXY-US
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Netflix/Netflix.list,PROXY-HK
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBili/BiliBili.list,DIRECT
DOMAIN-KEYWORD,qpic,DIRECT,pre-matching
DOMAIN-KEYWORD,apple,DIRECT,pre-matching
DOMAIN-KEYWORD,tencent,DIRECT,pre-matching
DOMAIN-KEYWORD,woa,DIRECT,pre-matching
DOMAIN-KEYWORD,wechat,DIRECT,pre-matching
DOMAIN-SUFFIX,ampproject.org,PROXY-US,pre-matching
# 国内外划分，对中国网站直连，外国网站代理。
GEOIP,CN,DIRECT
FINAL,PROXY-HK

[URL Rewrite]
^http://(www.)?google.cn https://www.google.com 302
